# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mengenmeldung

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# SQL-Ausgaben im Entwicklungsmodus
%dev.quarkus.hibernate-orm.log.sql=true

ear.soap.url=https://test.ear-system.de/ear-soap/v2/MitteilungsService
ear.soap.username=${EAR_SOAP_USERNAME:test}
ear.soap.password=${EAR_SOAP_PASSWORD:test}