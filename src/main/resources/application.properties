# PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=app
quarkus.datasource.password=app
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/mengenmeldung

# Hibernate ORM
quarkus.hibernate-orm.schema-management.strategy=update

# SQL-Ausgaben im Entwicklungsmodus
%dev.quarkus.hibernate-orm.log.sql=true

ear.soap.url=https://test.ear-system.de/ear-soap/v2/MitteilungsService
ear.soap.username=${EAR_SOAP_USERNAME:test}
ear.soap.password=${EAR_SOAP_PASSWORD:test}

quarkus.cxf.codegen.wsdl2java.includes=wsdl/*.wsdl


quarkus.cxf.client.ear.wsdl=wsdl/MitteilungsService.wsdl
quarkus.cxf.client.ear.client-endpoint-url=https://test.ear-system.de/ear-soap/v2/MitteilungsService
quarkus.cxf.client.ear.service-interface=de.ear_system.ear_soap.v2.MitteilungsServicePort

quarkus.cxf.client.ear.auth.username=${EAR_SOAP_USERNAME:test}
quarkus.cxf.client.ear.auth.password=${EAR_SOAP_PASSWORD:test}

#quarkus.cxf.client.ear.connection-timeout=10000
#quarkus.cxf.client.ear.receive-timeout=30000
